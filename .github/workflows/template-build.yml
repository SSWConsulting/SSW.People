name: Template - Build site

on:
  workflow_call:
    inputs:
      branch_name:
        required: true
        type: string
      environment:
        type: string
        required: true
        description: 'The environment to build for'

jobs:

  build-code:
    name: Gatsby
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch_name }}

      - uses: cschleiden/replace-tokens@v1
        with:
          tokenPrefix: '#{'
          tokenSuffix: '}'
          files: .env.template
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          GOOGLE_GTM_ID: ${{ secrets.GOOGLE_GTM_ID }}
          GOOGLE_ANALYTICS: ${{ secrets.GOOGLE_ANALYTICS }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          WEBSITE_API: ${{ secrets.WEBSITE_API }}
          CRM_APP_ID: ${{ secrets.CRM_APP_ID }}
          CRM_TENANT: ${{ secrets.CRM_TENANT }}
          CRM_TENANT_ID: ${{ secrets.CRM_TENANT_ID }}
          CRM_APP_SECRET: ${{ secrets.CRM_APP_SECRET }}
          CRM_SCOPE: ${{ secrets.CRM_SCOPE }}
          CRM_VIEW_CURRENT: ${{ secrets.CRM_VIEW_CURRENT }}
          CRM_VIEW_PAST: ${{ secrets.CRM_VIEW_PAST }}
          APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}
          CHINA_BUILD: FALSE
          VERSION_DEPLOYED: ${{ github.run_number }}
          COMMIT_HASH: ${{ github.sha }}

      - name: Rename env file
        run: |
          mv .env.template .env.production
          cat .env.production

      # .cache and public are cached together so they always match. Each main
      # build saves a fresh copy and every build restores the latest one. The
      # old fixed keys were never updated, so builds started from a stale
      # snapshot and could miss files copied from profiles (e.g. SVG badges).
      - name: Restore Gatsby cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache
            public
          key: gatsby-build-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            gatsby-build-${{ runner.os }}-

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build
        env:
          GATSBY_EXPERIMENTAL_PAGE_BUILD_ON_DATA_CHANGES: true

      # Only main saves, so PR and release builds don't fill the cache quota.
      - name: Save Gatsby cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            .cache
            public
          key: gatsby-build-${{ runner.os }}-${{ github.run_id }}

      - name: Archive artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: public

  build-infra:
    name: Infra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch_name }}
          sparse-checkout: |
            infra

      - name: Check the result
        run: |
          mkdir arm
          az bicep build --file infra/main.bicep --outdir arm

      - name: Archive artifacts
        uses: actions/upload-artifact@v7
        with:
          name: infra
          path: infra
